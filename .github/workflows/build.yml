name: Build Codebook
on:
  push:
    branches: [main]
    paths:
      - 'code_library/**'
      - 'codebook/**'
      - '!codebook/codebook.pdf'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: codebook
          root_file: codebook.tex
          latexmk_use_pdflatex: true
          args: -pdf -synctex=1 -interaction=nonstopmode
      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build codebook PDF"
          file_pattern: codebook/codebook.pdf
