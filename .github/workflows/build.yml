name: Build Codebook

on:
  push:
    branches: [main]
    paths:
      - 'code_library/**'
      - 'codebook/**'
      - '!codebook/codebook.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: codebook
          root_file: codebook.tex
          args: -pdf -synctex=1 -interaction=nonstopmode

      - name: Commit and Push PDF
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f codebook/codebook.pdf
          git commit -m "Auto-build codebook PDF [skip ci]" || echo "No changes to commit"
          git push
